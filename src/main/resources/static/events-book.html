<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ple - Event Ledger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        pre, code { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <div class="max-w-5xl mx-auto px-4 py-8">
        <!-- Header -->
        <header class="border-b border-slate-800 pb-6 mb-8 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
                <h1 class="text-3xl font-bold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-amber-300">
                    🦞 ple Event Ledger
                </h1>
                <p class="text-slate-400 mt-1">Live, deterministic event stream generated by ple.</p>
            </div>
            <div class="flex gap-3">
                <a href="/swagger-ui/index.html" class="px-4 py-2 rounded-lg bg-orange-600 hover:bg-orange-500 font-semibold text-sm transition">
                    Explore API (Swagger)
                </a>
                <button onclick="fetchEvents()" class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 font-semibold text-sm transition">
                    🔄 Refresh Stream
                </button>
            </div>
        </header>

        <!-- Stats -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-5">
                <div class="text-xs text-slate-400 font-semibold uppercase tracking-wider">Engine Status</div>
                <div class="text-2xl font-bold text-green-400 mt-1 flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-green-500 animate-pulse"></span>
                    Running
                </div>
            </div>
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-5">
                <div class="text-xs text-slate-400 font-semibold uppercase tracking-wider">Total Recorded Events</div>
                <div id="event-count" class="text-3xl font-extrabold mt-1 text-orange-400">0</div>
            </div>
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-5">
                <div class="text-xs text-slate-400 font-semibold uppercase tracking-wider">Target Aggregate</div>
                <div class="text-2xl font-bold text-indigo-400 mt-1 uppercase">Book</div>
            </div>
        </div>

        <!-- Timeline Container -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6">
            <h2 class="text-xl font-bold mb-6 text-slate-200">Event Stream Timeline</h2>
            
            <div id="no-events" class="text-center py-12 text-slate-500">
                <p class="text-lg">No events in the ledger yet.</p>
                <p class="text-sm mt-2">Trigger some commands in the Swagger UI to populate the event stream!</p>
            </div>

            <div id="timeline" class="relative border-l-2 border-slate-700 ml-4 pl-8 space-y-8 hidden">
                <!-- Event cards injected here -->
            </div>
        </div>
    </div>

    <script>
        async function fetchEvents() {
            try {
                const response = await fetch('/api/book/events/all');
                if (!response.ok) throw new Error('Failed to fetch events');
                const events = await response.json();
                
                document.getElementById('event-count').innerText = events.length;
                
                const timeline = document.getElementById('timeline');
                const noEvents = document.getElementById('no-events');
                
                if (events.length === 0) {
                    noEvents.classList.remove('hidden');
                    timeline.classList.add('hidden');
                    return;
                }
                
                noEvents.classList.add('hidden');
                timeline.classList.remove('hidden');
                timeline.innerHTML = '';
                
                // Render newest events first
                const reversedEvents = [...events].reverse();
                reversedEvents.forEach((event, idx) => {
                    const card = document.createElement('div');
                    card.className = "relative group";
                    
                    const timestamp = event.timestamp ? new Date(event.timestamp).toLocaleString() : 'N/A';
                    const eventName = event.type || event.eventName || event.class || 'DomainEvent';
                    const payload = event.payload ? JSON.stringify(event.payload, null, 2) : (event.data ? JSON.stringify(event.data, null, 2) : '{}');
                    
                    card.innerHTML = 
                        '<span class="absolute -left-[41px] top-1.5 flex items-center justify-center w-6 h-6 rounded-full bg-slate-950 border-2 border-orange-500 text-xs">' +
                        (events.length - idx) +
                        '</span>' +
                        '<div class="bg-slate-900 border border-slate-700 rounded-xl p-5 hover:border-slate-600 transition">' +
                            '<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-3">' +
                                '<span class="text-lg font-bold text-slate-100 flex items-center gap-2">' +
                                    '<span class="w-2 h-2 rounded-full bg-orange-400"></span>' +
                                    eventName +
                                '</span>' +
                                '<span class="text-xs text-slate-500 font-medium bg-slate-950 px-2 py-1 rounded-md border border-slate-700">' +
                                    timestamp +
                                '</span>' +
                            '</div>' +
                            '<div class="bg-slate-950 rounded-lg p-4 border border-slate-700 overflow-x-auto">' +
                                '<pre class="text-xs text-orange-200 leading-relaxed">' + payload + '</pre>' +
                            '</div>' +
                        '</div>';
                    timeline.appendChild(card);
                });
            } catch (err) {
                console.error(err);
                document.getElementById('no-events').innerHTML =
                    '<p class="text-lg text-red-400">Failed to load events</p>' +
                    '<p class="text-sm text-slate-500 mt-2">' + err.message + '</p>';
            }
        }
        
        // Initial Fetch
        fetchEvents();
        
        // Auto-refresh every 5 seconds
        setInterval(fetchEvents, 5000);
    </script>
</body>
</html>
